# 生产部署:直接从 GHCR 拉预构建镜像,不需要本地构建。
#
# 用法:
#   # 1. 复制环境变量模板
#   cp .env.example .env  # 编辑填入 OPENAI_API_KEY
#
#   # 2. 拉镜像 + 起服务
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
#   # 看日志
#   docker compose -f docker-compose.prod.yml logs -f
#
#   # 停止
#   docker compose -f docker-compose.prod.yml down
#
# 镜像支持 linux/amd64 与 linux/arm64,Docker 会自动选合适的架构。
#
# 想固定到某个版本(避免 latest 滚动):把 IMAGE_TAG 设为 sha-xxxxxxx 或语义版本
# 例如 IMAGE_TAG=sha-3845d4d 或 IMAGE_TAG=v0.1.0

services:
  backend:
    image: ghcr.io/littlechiu/ai-pr-reviewer/backend:${IMAGE_TAG:-latest}
    container_name: ai-pr-reviewer-backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://https://your-gateway.example.com/v1}
      PRIMARY_MODEL: ${PRIMARY_MODEL:-deepseek-v4-pro-max}
      FAST_MODEL: ${FAST_MODEL:-deepseek-v4-flash}
      VISION_MODEL: ${VISION_MODEL:-gemini-3.1-flash-lite}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-claude-sonnet-4-6}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_DB_PATH: /data/cache.db
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
    volumes:
      - cache:/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ghcr.io/littlechiu/ai-pr-reviewer/frontend:${IMAGE_TAG:-latest}
    container_name: ai-pr-reviewer-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cache:
