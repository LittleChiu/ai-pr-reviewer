services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ai-pr-reviewer-backend:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://your-gateway.example.com/v1}
      PRIMARY_MODEL: ${PRIMARY_MODEL:-deepseek-v4-pro-max}
      FAST_MODEL: ${FAST_MODEL:-deepseek-v4-flash}
      VISION_MODEL: ${VISION_MODEL:-gemini-3.1-flash-lite}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-claude-sonnet-4-6}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_DB_PATH: /data/cache.db
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - cache:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ai-pr-reviewer-frontend:latest
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cache:
