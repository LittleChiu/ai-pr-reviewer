name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref 上后续 push 自动取消上一次正在跑的 CI,节省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if backend not yet present
        id: check
        run: |
          if [ ! -f backend/pyproject.toml ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        if: steps.check.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv sync --all-extras

      - name: Lint (ruff)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv run ruff check .

      - name: Format check (ruff)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check (mypy)
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv run mypy app || true

      - name: Tests
        if: steps.check.outputs.exists == 'true'
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if frontend not yet present
        id: check
        run: |
          if [ ! -f frontend/package.json ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.check.outputs.exists == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm typecheck || pnpm exec tsc --noEmit

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: pnpm build
